name: Build & Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "preview"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish
        run: dotnet publish src/Imrdy.Windows -c Release -r win-x64 --self-contained

      - name: Integration Tests
        run: dotnet test tests/Imrdy.Integration.Tests -c Release --verbosity normal
        env:
          IMRDY_BINARY_PATH: src/Imrdy.Windows/bin/Release/net10.0-windows/win-x64/publish/imrdy.exe
